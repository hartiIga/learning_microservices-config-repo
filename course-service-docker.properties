server.port=8889
spring.application.name=course-service
spring.datasource.url=jdbc:h2:mem:coursedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# application.config.student-url=http://student-service:8888
application.config.registry-url=http://registry-service:8761/eureka
eureka.client.service-url.defaultZone=http://registry-service:8761/eureka

eureka.client.enabled=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Enable Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

#resilience4j
resilience4j.circuitbreaker.instances.student-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.student-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.student-service.wait-duration-in-open-state=5s
